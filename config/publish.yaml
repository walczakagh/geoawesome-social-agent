# Direct publishing to the Geoawesome Facebook Page and its linked Instagram
# account. Nothing is posted unless a post's box is ticked in a daily issue.
#
# The only secret needed is META_PAGE_TOKEN (a Page access token).
# See README, "Publishing to Facebook and Instagram".

timezone: Europe/Warsaw

# Time slots a ticked post can take, local time. Each slot holds one post, so
# the number of slots is the maximum number of posts per day.
#   ["06:00", "10:00"]  a window: the post goes out at a random minute inside it
#   "16:00"             a fixed time: the post goes out within +/- jitter_minutes
slots:
  - ["06:00", "10:00"]
  - ["16:00", "21:00"]
  - ["11:00", "15:00"]

# Only used for fixed-time slots (see above).
jitter_minutes: 40

# The publisher checks every 10 minutes and GitHub sometimes starts scheduled
# runs a few minutes late, so a post can go out up to ~15 minutes after the
# time in the confirmation comment.

# A post is never put into a slot that starts sooner than this.
min_lead_minutes: 30

# The Facebook Page ID (the Page connected to Metricool as "geoawesome.digital").
facebook_page_id: "302602119827463"

# Leave empty to look it up from the Page (instagram_business_account).
instagram_user_id: ""

networks: [facebook, instagram]

# Posted by hand. When a post is live on Facebook and Instagram, a comment on
# the issue @mentions the repo owner (GitHub emails it) with the YouTube
# Community text and the X text for Buffer, plus the image link.
manual: [youtube, x]
youtube_channel_id: "UCqGv3p_twfy-LT86l52Wzdg"

graph_version: v26.0   # current as of Oct 2026; Meta supports each version about 2 years

# A network that fails is retried on the next runs (10 minutes apart), up to this many times.
max_attempts: 3
