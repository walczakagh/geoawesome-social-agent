name: Probe sources

# Checks which feeds answer from GitHub's runners and lists what a run would
# hand to the shortlist, without calling Claude. Runs on pushes to probe/*
# branches or by hand; results are committed to tools/probe_results/.
on:
  push:
    branches: ["probe/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probe feeds and list candidates
        env:
          GOOGLE_ALERTS_FEEDS: ${{ secrets.GOOGLE_ALERTS_FEEDS }}
        run: |
          set -euo pipefail
          mkdir -p tools/probe_results
          python tools/probe_sources.py tools/probe_urls.txt | tee tools/probe_results/feeds.txt
          python -m agent.main --scout-only | tee tools/probe_results/candidates.txt
          { echo '```'; cat tools/probe_results/candidates.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Save results on the branch
        if: startsWith(github.ref_name, 'probe/')
        run: |
          set -euo pipefail
          git config user.name "geoawesome-social-agent"
          git config user.email "actions@users.noreply.github.com"
          git add tools/probe_results
          git diff --cached --quiet || git commit -m "Probe results $(date -u +%FT%H%M)"
          git push
