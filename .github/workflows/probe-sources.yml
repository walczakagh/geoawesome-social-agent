name: Probe sources

# Checks which feeds answer from GitHub's runners and lists what a run would
# hand to the shortlist, without calling Claude. Runs on pushes to probe/*
# branches or by hand; results are committed to tools/probe_results/.
on:
  push:
    branches: ["probe/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probe feeds and list candidates
        env:
          GOOGLE_ALERTS_FEEDS: ${{ secrets.GOOGLE_ALERTS_FEEDS }}
          RECHECK: ${{ vars.RECHECK || 'drafts/2026-10-17.json' }}
        run: |
          set -uo pipefail
          mkdir -p tools/probe_results
          python tools/probe_sources.py tools/probe_urls.txt > tools/probe_results/feeds.txt 2>&1 || true
          python -m agent.main --scout-only > tools/probe_results/candidates.txt 2>&1 || true
          if [ -n "${RECHECK:-}" ]; then PYTHONPATH=. python tools/recheck_images.py "$RECHECK" > tools/probe_results/images.txt 2>&1 || echo "EXIT $?" >> tools/probe_results/images.txt; fi
          { echo '```'; cat tools/probe_results/candidates.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Save results on the branch
        if: always() && startsWith(github.ref_name, 'probe/')
        run: |
          set -euo pipefail
          git config user.name "geoawesome-social-agent"
          git config user.email "actions@users.noreply.github.com"
          git add -f tools/probe_results
          git diff --cached --quiet || git commit -m "Probe results $(date -u +%FT%H%M)"
          git push
