name: Social drafts

on:
  schedule:
    # 06:47 UTC daily (08:47 in Kraków during summer time, 07:47 in winter)
    - cron: "47 6 * * *"
  workflow_dispatch:
    inputs:
      max_items:
        description: "Maximum number of items to draft (leave empty to use config/drafts.yaml)"
        default: ""
      max_age_days:
        description: "Ignore feed items older than this many days"
        default: "7"
      dry_run:
        description: "Do not mark items as seen (for testing)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: repo-state
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scout, shortlist and draft
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          GOOGLE_ALERTS_FEEDS: ${{ secrets.GOOGLE_ALERTS_FEEDS }}
          MAX: ${{ inputs.max_items }}
        run: |
          set -euo pipefail
          # cron-job.org starts this run on time; GitHub's own timer is only a
          # backup and often fires hours late. Skip it if today is already done.
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ] && [ -f "drafts/$(date -u +%F).json" ]; then
            echo "Today's drafts already exist (started by cron-job.org); skipping the late GitHub timer."
            echo "SKIPPED=1" >> "$GITHUB_ENV"
            exit 0
          fi
          DRY=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then DRY="--dry-run"; fi
          python -m agent.main \
            ${MAX:+--max-items "$MAX"} \
            --max-age-days "${{ inputs.max_age_days || '7' }}" \
            $DRY 2>&1 | tee run.log

      - name: Show error on the run summary
        if: failure()
        run: |
          {
            echo "## Run failed"
            echo
            echo "Last lines of the log:"
            echo
            echo '```'
            tail -n 40 run.log 2>/dev/null || echo "(no log written)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit state and drafts
        if: env.SKIPPED != '1'
        run: |
          set -euo pipefail
          git config user.name "geoawesome-social-agent"
          git config user.email "actions@users.noreply.github.com"
          git add state drafts
          git diff --cached --quiet || git commit -m "Social drafts $(date -u +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

      - name: Open review issue
        if: env.SKIPPED != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DIGEST="drafts/$(date -u +%F).md"
          gh label create social-drafts --color 4722f1 --description "Daily social drafts" 2>/dev/null || true
          if grep -q "No items worth posting today" "$DIGEST"; then
            echo "Nothing to review today, no issue opened."
            exit 0
          fi
          gh issue create \
            --title "Geoawesome reposts $(date -u +%F)" \
            --label social-drafts \
            --body-file "$DIGEST"

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: social-drafts-run
          path: |
            run.log
            drafts/
          if-no-files-found: warn
